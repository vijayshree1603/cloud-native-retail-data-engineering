services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  etl:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m src.pipeline
    environment:
      DATABASE_URL: postgresql+psycopg://retail:retail@postgres:5432/retail
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/data/raw
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://retail:retail@postgres:5432/retail
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      etl:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres_data:
